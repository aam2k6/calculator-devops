services:
  calculator:
    image: aam2k6/calculator:${IMAGE_TAG:-latest}
    container_name: calculator
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
    networks:
      - calculator-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q 'UP'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  nginx:
    image: nginx:alpine
    container_name: calculator-nginx
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      calculator:
        condition: service_healthy
    networks:
      - calculator-network

networks:
  calculator-network:
    driver: bridge
